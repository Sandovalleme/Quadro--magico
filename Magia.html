<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folha Mágica Gigante - Cores e Rolagem Sincronizada</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  .toolbar { background: #181818; padding: 6px 10px; width: 100%; display: flex; gap: 5px; justify-content: center; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.7); flex-wrap: wrap; z-index: 30; border-bottom: 1px solid #333; }
  button, input { padding: 5px 8px; border-radius: 4px; border: none; font-size: 12px; cursor: pointer; }
  button { background: #333; color: #fff; transition: 0.15s; white-space: nowrap; }
  button:hover { background: #4a4a4a; }
  button.active { background: #0078d4; font-weight: bold; }
  button.active-org { background: #2e7d32; font-weight: bold; }
  button.btn-pdf { background: #a82424; }
  button.btn-pdf:hover { background: #c92e2e; }
  button.btn-portal { background: linear-gradient(135deg, #10b981, #059669); color: #052e16; font-weight: bold; }
  button.btn-portal:hover { filter: brightness(1.08); }
  #statusApresentacao { background: #0d0d0d; padding: 5px 9px; border-radius: 4px; font-size: 12px; color: #4fc3f7; border: 1px solid #333; min-width: 165px; text-align: center; cursor: pointer; }
  .pdf-nav { display: none; align-items: center; gap: 4px; background: #2c2c2c; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  .workspace { flex: 1; width: 100%; height: 100%; overflow: scroll; position: relative; background: #ffffff; }
  .workspace::-webkit-scrollbar { width: 14px; height: 14px; }
  .workspace::-webkit-scrollbar-track { background: #e8e8e8; }
  .workspace::-webkit-scrollbar-thumb { background: #9e9e9e; border-radius: 7px; border: 2px solid #e8e8e8; }
  .workspace::-webkit-scrollbar-thumb:hover { background: #757575; }
  #folhaGigante { position: relative; width: 4500px; height: 6000px; background: #ffffff; }
  #viewportCanvasWrap { position: sticky; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  canvas { position: absolute; top: 0; left: 0; display: block; }
  #folhaPdfFundo { z-index: 1; pointer-events: none; }
  #folhaBase { z-index: 2; pointer-events: none; }
  #folhaInvisivel { z-index: 3; pointer-events: auto; cursor: crosshair; }
  #popupEdicao { position: absolute; display: none; z-index: 50; background: #1e1e1e; border: 1px solid #555; border-radius: 6px; padding: 5px 7px; box-shadow: 0 4px 14px rgba(0,0,0,0.5); gap: 4px; align-items: center; flex-wrap: wrap; }
  #popupEdicao button { padding: 4px 8px; font-size: 12px; font-weight: bold; background: #333; }
  #popupEdicao button:hover { background: #0078d4; }
  #popupEdicao button.btn-del:hover { background: #c62828; }
  #popupLabel { font-size: 11px; color: #ccc; padding-right: 4px; font-weight: bold; }
  .color-swatch { width: 18px !important; height: 18px !important; padding: 0 !important; border-radius: 50% !important; border: 2px solid #fff !important; cursor: pointer; display: inline-block; }
  .color-swatch:hover { transform: scale(1.18); }
  .popup-sep { width: 1px; height: 18px; background: #444; margin: 0 2px; }
  #modalEntrada { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); display: none; justify-content: center; align-items: center; z-index: 100; }
  .modal-box { background: #252526; border: 1px solid #454545; padding: 18px; border-radius: 8px; width: 420px; max-width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }

  .modal-box input { width: 100%; padding: 9px; font-size: 15px; background: #111; color: #fff; border: 1px solid #555; border-radius: 4px; margin-bottom: 12px; user-select: text; cursor: text; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

  #student-fm-bar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.45);
    padding: 10px 18px;
    border-radius: 999px;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 200;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
    flex-wrap: wrap;
    justify-content: center;
  }
  .fm-st-btn {
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid rgba(255, 255, 255, 0.16);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }
  .fm-st-btn:hover { background: #334155; }
  .fm-st-btn-play {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #052e16;
    border: none;
  }
  #fm-st-status {
    color: #38bdf8;
    font-size: 12px;
    font-weight: 800;
    padding: 0 6px;
  }
  #fm-loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.94);
    color: #f8fafc;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 300;
    text-align: center;
    padding: 24px;
  }
</style>
</head>
<body>
<div class="toolbar" id="mainToolbar">
  <button class="btn-pdf" onclick="document.getElementById('pdfInput').click()" title="Abrir arquivo PDF na folha">📄 Abrir PDF</button>
  <div class="pdf-nav" id="pdfNav"><button onclick="mudarPaginaPdf(-1)">◀</button><span id="pdfPageInfo">1/1</span><button onclick="mudarPaginaPdf(1)">▶</button></div>
  <button onclick="document.getElementById('imgInput').click()" title="Inserir imagem ou use Ctrl+V">🖼️ + Imagem</button>
  <button onclick="abrirModalTexto('formula')" title="Inserir fórmula matemática">∑ Fórmula</button>
  <button id="btnDesenhar" class="active" onclick="setModo('desenhar')">✏️ 1. Desenhar</button>
  <button onclick="abrirModalTexto('texto')">🔤 + Texto</button>
  <button id="btnOrganizar" onclick="setModo('organizar')">✋ 2. Organizar</button>
  <button id="btnMover" onclick="setModo('mover')">🪄 3. Caminho</button>
  <button id="btnApresentar" onclick="setModo('apresentar')">▶️ 4. Apresentar</button>
  <span id="statusApresentacao" onclick="if(modo==='apresentar') executarProximoPasso()">Modo: Desenho</span>
  <label style="font-size:12px;">Vel.: <input type="range" id="velocidade" min="0.2" max="4" step="0.2" value="1" style="width:65px; vertical-align:middle;"></label>
  <button onclick="irParaInicioRolagem()" title="Voltar a barra de rolagem para o topo esquerdo">↖ Topo</button>
  <button onclick="salvarProjeto()">💾 Salvar</button>
  <button class="btn-portal" onclick="salvarParaPortal()" title="Exportar aula pronta para publicar no Portal dos Alunos">🌐 Publicar Portal</button>
  <button onclick="document.getElementById('carregarInput').click()">📂 Abrir</button>
  <button onclick="limparTudo()" style="background:#8a2424;">🗑️ Limpar</button>
  <input type="file" id="pdfInput" style="display:none" accept="application/pdf,.pdf" onchange="carregarArquivoPdf(event)">
  <input type="file" id="imgInput" style="display:none" accept="image/*" onchange="carregarImagemArquivo(event)">
  <input type="file" id="carregarInput" style="display:none" accept=".json" onchange="carregarProjeto(event)">
</div>

<div class="workspace" id="workspaceArea">
  <div id="folhaGigante">
    <div id="viewportCanvasWrap"><canvas id="folhaPdfFundo"></canvas><canvas id="folhaBase"></canvas><canvas id="folhaInvisivel"></canvas></div>
    <div id="popupEdicao" onmousedown="event.stopPropagation()">
      <span id="popupLabel">Item</span>
      <div id="grupoCoresPopup" style="display:flex; gap:4px; align-items:center;">
        <button class="color-swatch" style="background:#111111;" onclick="mudarCorSelecionado('#111111')" title="Preto"></button>
        <button class="color-swatch" style="background:#0b3d91;" onclick="mudarCorSelecionado('#0b3d91')" title="Azul Escuro"></button>
        <button class="color-swatch" style="background:#d93025;" onclick="mudarCorSelecionado('#d93025')" title="Vermelho"></button>
        <button class="color-swatch" style="background:#188038;" onclick="mudarCorSelecionado('#188038')" title="Verde"></button>
        <button class="color-swatch" style="background:#e37400;" onclick="mudarCorSelecionado('#e37400')" title="Laranja"></button>
        <button class="color-swatch" style="background:#7b1fa2;" onclick="mudarCorSelecionado('#7b1fa2')" title="Roxo"></button>
        <input type="color" id="seletorCorLivre" value="#0b3d91" oninput="mudarCorSelecionado(this.value)" title="Escolher outra cor" style="width:22px; height:20px; padding:0; border:none; background:none; cursor:pointer;">
        <span class="popup-sep"></span>
      </div>
      <button onclick="redimensionarSelecionado(1.15)" title="Aumentar tamanho/fonte">➕</button>
      <button onclick="redimensionarSelecionado(0.87)" title="Diminuir tamanho/fonte">➖</button>
      <button onclick="removerCaminhoSelecionado()" title="Apagar apenas o caminho gravado">↩️ Sem caminho</button>
      <button class="btn-del" onclick="excluirSelecionado()" title="Excluir objeto">🗑️</button>
    </div>
  </div>
</div>

<div id="modalEntrada">
  <div class="modal-box">
    <h3 id="modalTitulo">Digite o texto:</h3>
    <input type="text" id="modalInput" placeholder="Escreva aqui e aperte Enter...">
    <div class="modal-actions">
      <button onclick="fecharModalTexto()">Cancelar</button>
      <button style="background:#0078d4; font-weight:bold;" onclick="confirmarModalTexto()">Inserir na Folha</button>
    </div>
  </div>
</div>

<div id="fm-loading-overlay">
  <h2 style="margin-bottom:8px;">✨ Carregando Folha Mágica...</h2>
  <p id="fm-loading-text" style="color:#94a3b8; font-size:14px;">Sincronizando aula e animações...</p>
</div>

<div id="student-fm-bar">
  <a href="index.html" class="fm-st-btn">← Portal</a>
  <button type="button" class="fm-st-btn" onclick="setModo('apresentar')">🔄 Reiniciar</button>
  <span id="fm-st-status">Pronto</span>
  <button type="button" class="fm-st-btn fm-st-btn-play" onclick="executarProximoPasso()">▶️ Próximo Passo</button>
  <button type="button" class="fm-st-btn" onclick="irParaInicioRolagem()">↖ Topo</button>
</div>
