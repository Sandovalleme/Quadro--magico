<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
  <title>LOSA Web - Controle do Professor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: pan-x pan-y; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #0f172a; color: #334155; overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; }
    #toolbar { background: #f8fafc; border-bottom: 2px solid #cbd5e1; padding: 8px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08); }
    .divider { width: 2px; height: 28px; background-color: #cbd5e1; margin: 0 4px; }
    button { padding: 8px 12px; border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 5px; }
    button:hover { filter: brightness(0.92); transform: translateY(-1px); }
    .btn-blue { background-color: #3b82f6; color: white; }
    .btn-green { background-color: #10b981; color: white; }
    .btn-purple { background-color: #8b5cf6; color: white; }
    .btn-red { background-color: #ef4444; color: white; }
    .btn-orange { background-color: #f59e0b; color: white; }
    .btn-teal { background-color: #0d9488; color: white; }
    .btn-cyan { background-color: #0284c7; color: white; }
    .btn-pink { background-color: #ec4899; color: white; }
    .btn-gold { background-color: #d97706; color: white; }
    .btn-indigo { background-color: #4f46e5; color: white; }
    .btn-gray { background-color: #e2e8f0; color: #475569; }
    .btn-toggle.active-texto { background-color: #3b82f6; color: white; }
    .btn-toggle.active-passo { background-color: #f59e0b; color: white; }
    .btn-toggle.active-pincel { background-color: #10b981; color: white; }
    .btn-toggle.active-ret { background-color: #06b6d4; color: white; }
    label { font-size: 12px; font-weight: 700; color: #475569; }
    select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; background: white; font-weight: 600; outline: none; }
    #viewport-container { flex: 1; overflow-y: auto; overflow-x: auto; background-color: #1e293b; position: relative; display: flex; justify-content: center; padding: 24px 0 80px 0; }
    #zoom-content { display: flex; flex-direction: column; align-items: center; transform-origin: top center; transition: transform 0.08s ease-out; }
    .page-wrapper { position: relative; margin-bottom: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); background-color: white; }
    .pdf-canvas { display: block; }
    .mask-canvas { position: absolute; top: 0; left: 0; cursor: crosshair; z-index: 10; touch-action: none; }
    #media-overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.92); z-index: 9999; display: none; justify-content: center; align-items: center; overflow: hidden; }
    #media-overlay video { max-width: 92vw; max-height: 92vh; border-radius: 8px; object-fit: contain; }
    #img-container-interactive { display: none; position: absolute; cursor: grab; touch-action: none; transform-origin: center center; }
    #img-container-interactive:active { cursor: grabbing; }
    #player-imagem { max-width: 90vw; max-height: 85vh; border-radius: 8px; object-fit: contain; pointer-events: none; }
    #fm-stage-container { display: none; width: 95vw; height: 88vh; background: #ffffff; border-radius: 10px; box-shadow: 0 15px 40px rgba(0,0,0,0.75); overflow: scroll; position: relative; cursor: pointer; }
    #fm-gigante { position: relative; width: 4500px; height: 6000px; background: #ffffff; }
    #fm-viewport-wrap { position: sticky; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #fm-viewport-wrap canvas { position: absolute; top: 0; left: 0; display: block; }
    #fm-hud-controls { display: none; position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10001; background: rgba(15, 23, 42, 0.92); color: #f8fafc; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.25); gap: 10px; align-items: center; font-size: 12px; font-weight: 700; }
    #img-zoom-hud { display: none; position: fixed; top: 10px; right: 10px; z-index: 10000; background: rgba(15, 23, 42, 0.85); padding: 4px 8px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); gap: 4px; align-items: center; }
    #show-hud-container { display: none; position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10005; align-items: center; gap: 10px; background: rgba(15, 23, 42, 0.92); padding: 8px 18px; border-radius: 30px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); }
    #btn-show-center { padding: 8px 18px; font-size: 13px; font-weight: 800; border-radius: 20px; background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; }
    #show-info { color: #f8fafc; font-weight: 700; font-size: 12px; min-width: 85px; text-align: center; }
    .btn-sair-show { background: rgba(239, 68, 68, 0.9); color: white; border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 700; }
    #zoom-controls-floating { position: fixed; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 900; background: rgba(15, 23, 42, 0.85); padding: 5px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.15); }
    .btn-zoom { width: 32px; height: 32px; border-radius: 6px; background: #334155; color: white; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; padding: 0; }
    .btn-zoom:hover { background: #475569; }
    body.modo-show-ativo #toolbar { display: none !important; }
  </style>

<body>
  <header id="toolbar">
    <button class="btn-blue" onclick="document.getElementById('input-pdf').click()">📂 PDF</button>
    <input type="file" id="input-pdf" accept="application/pdf,.pdf" style="display:none" onchange="carregarPDFManual(event)">
    <button class="btn-green" onclick="salvarLosa()">💾 SALVAR</button>
    <button class="btn-purple" onclick="document.getElementById('input-losa').click()">📂 ABRIR .LOSA</button>
    <input type="file" id="input-losa" accept=".losa,.json" style="display:none" onchange="carregarLosa(event)">
    <button class="btn-indigo" id="btn-tela-aluno" onclick="abrirTelaAluno()">📺 TELA ALUNO</button>
    <button class="btn-gold" onclick="gerarRelatorioDiagnostico()">📋 DIAGNÓSTICO</button>
    <button class="btn-red" onclick="desfazerUltimo()">↩️</button>
    <div class="divider"></div>
    <button class="btn-orange" onclick="document.getElementById('input-video-passo').click()">🎬 VÍDEO</button>
    <input type="file" id="input-video-passo" accept="video/mp4,video/webm,video/mkv" style="display:none" onchange="vincularVideoArquivoLocal(event)">
    <button class="btn-teal" onclick="document.getElementById('input-imagem-passo').click()">🖼️ IMAGEM</button>
    <input type="file" id="input-imagem-passo" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml" style="display:none" onchange="vincularImagemArquivoLocal(event)">
    <button class="btn-cyan" onclick="document.getElementById('input-fm-passo').click()">🪄 FOLHA MÁGICA</button>
    <input type="file" id="input-fm-passo" accept=".json,application/json" style="display:none" onchange="vincularFolhaMagicaArquivoLocal(event)">
    <div class="divider"></div>
    <select id="select-espessura" title="Espessura do Pincel">
      <option value="15">Fina (15)</option>
      <option value="30">Média (30)</option>
      <option value="45" selected>Larga (45)</option>
      <option value="60">Extra (60)</option>
    </select>
    <button id="btn-modo-texto" class="btn-toggle active-texto" onclick="setModoAgrupamento('texto')">TEXTO</button>
    <button id="btn-modo-passo" class="btn-toggle btn-gray" onclick="setModoAgrupamento('passo')">PASSO</button>
    <button id="btn-ferr-pincel" class="btn-toggle active-pincel" onclick="setFerramenta('pincel')">🖍️</button>
    <button id="btn-ferr-rect" class="btn-toggle btn-gray" onclick="setFerramenta('retangulo')">🔲</button>
    <div class="divider"></div>
    <button id="btn-editar-mascara" class="btn-green" onclick="alternarEdicao()">🎨 MÁSCARA</button>
    <button class="btn-pink" onclick="iniciarModoShow()">🎬 SHOW</button>
  </header>
  <div id="zoom-controls-floating">
    <button class="btn-zoom" onclick="ajustarZoom(0.15)">➕</button>
    <button class="btn-zoom" onclick="resetarZoom()" style="font-size:10px;">100%</button>
    <button class="btn-zoom" onclick="ajustarZoom(-0.15)">➖</button>
  </div>
  <main id="viewport-container"><div id="zoom-content"></div></main>
  <div id="img-zoom-hud">
    <button class="btn-zoom" onclick="ajustarZoomImagem(0.2)">➕</button>
    <button class="btn-zoom" style="width:42px; font-size:10px;" onclick="resetarZoomImagem()">100%</button>
    <button class="btn-zoom" onclick="ajustarZoomImagem(-0.2)">➖</button>
    <button class="btn-sair-show" onclick="fecharMidia()">✕ FECHAR</button>
  </div>
  <div id="fm-hud-controls">
    <span id="fm-step-label">🪄 Folha Mágica: 0/0</span>
    <label style="color:#cbd5e1;">Vel.: <input type="range" id="fm-velocidade" min="0.2" max="4" step="0.2" value="1" style="width:70px; vertical-align:middle;"></label>
    <button class="btn-cyan" style="padding:4px 10px;" onclick="avancarPassoFolhaMagica()">▶ Mover Objeto</button>
    <button class="btn-sair-show" onclick="fecharMidia()">✕ FECHAR FOLHA</button>
  </div>
  <div id="media-overlay">
    <video id="player-video" playsinline controls style="display:none"></video>
    <div id="img-container-interactive"><img id="player-imagem" alt="Imagem do Passo"></div>
    <div id="fm-stage-container" onclick="avancarPassoFolhaMagica()">
      <div id="fm-gigante"><div id="fm-viewport-wrap"><canvas id="fm-canvas-pdf"></canvas><canvas id="fm-canvas-base"></canvas><canvas id="fm-canvas-top"></canvas></div></div>
    </div>
  </div>
  <div id="show-hud-container">
    <div id="show-info">T: 0/0 | P: 0/0</div>
    <button id="btn-show-center" onclick="revelarSequencial()">REVELAR PRÓXIMO ➔</button>
    <button class="btn-sair-show" onclick="sairModoShow()">✕ SAIR</button>
  </div>
